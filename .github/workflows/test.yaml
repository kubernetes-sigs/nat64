name: Test

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.25.x]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
      with:
        go-version: ${{ matrix.go-version }}
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
    - run: sudo make test
    - run: make lint

